<ul>
{{~ for post in posts | array.sort "published" | array.reverse  ~}}
  <li><span>{{ post.published }}: </span><a href="{{ post.slug }}">{{ post.title }}</a>
	<ul>
	{{~ for tag in post.tags ~}}
		<li>{{ tag }}</li>
	{{~ end ~}}
	</ul>
  </li>
{{~ end ~}}
</ul>
