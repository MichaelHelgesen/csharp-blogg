<ul style="list-style-type: none; padding: 0;">
	{{~ for post in posts | array.sort "published" | array.reverse  ~}}
	<li style="margin-bottom: 1rem;">
		<small style="font-weight: bold;">{{ post.published }}: </small>
		<h2 style="margin: 0; color: #343a40; padding: 0.5rem 0;">
			<a style="color: #343a40; text-decoration: none;" href="{{ post.slug }}">{{ post.title }}</a>
		</h2>
		{{ if post.tags | array.size > 0 }}
		<ul style="list-style-type: none; display: flex; gap: 0.5rem; margin: 0; padding: 0;">
			{{~ for tag in post.tags ~}}
			<li style="background-color: #6c757d; font-size: 0.875rem; color: #ffffff; padding: 0.25rem 0.5rem; border-radius: 0.25rem;">#{{ tag }}</li>
			{{~ end ~}}
		</ul>
		{{ end }}
	</li>
	{{~ end ~}}
</ul>
